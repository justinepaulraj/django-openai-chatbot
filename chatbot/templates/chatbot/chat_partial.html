<!-- New Conversation button -->
<div class="mb-2">
    <form hx-post="{% url 'new_conversation' %}" hx-target="#sidebar" hx-swap="innerHTML">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-primary w-100">+ New Conversation</button>
    </form>
</div>

<!-- Conversations list -->
<ul class="list-group">
    {% for convo in conversations %}
        <li class="list-group-item d-flex justify-content-between align-items-center
            {% if convo.id == current_conversation.id %}active{% endif %}">

            <a href="{% url 'chat' %}?conversation_id={{ convo.id }}" class="flex-grow-1 text-decoration-none text-dark me-2">
                {{ convo.title|default:"Untitled Conversation" }}
            </a>

            <form 
                hx-post="{% url 'delete_conversation' convo.id %}" 
                hx-target="#sidebar" 
                hx-swap="innerHTML"
                class="m-0 p-0"
            >
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-danger p-0" style="line-height: 1;">✖</button>
            </form>

        </li>
    {% empty %}
        <li class="list-group-item">No conversations yet.</li>
    {% endfor %}
</ul>
